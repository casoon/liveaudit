[workspace]
members = ["packages/core"]
# Der Spike bleibt als Beleg der Messung stehen und wird nicht weiterentwickelt.
exclude = ["spike/core"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/casoon/liveaudit"

# Der Regelbestand kommt fertig aus a11y-core und wird hier nur eingebunden.
# Regeln gehören nicht in dieses Repository — siehe CLAUDE.md.
[workspace.dependencies]
a11y-dom = "0.10.0"
a11y-report = "0.10.0"
a11y-rules = "0.10.0"
accname = "0.10.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
