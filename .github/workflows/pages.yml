name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Die Demo-Seite lädt das gebaute Bundle. Ohne diesen Schritt stünde dort
      # eine Schaltfläche, die nichts findet.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      # Ohne version: Die Action nimmt packageManager aus der package.json.
      # Beides gesetzt bricht sie mit "Multiple versions of pnpm specified" ab.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/configure-pages@v6

      # Ein Workspace, ein Lockfile: Die Seite hängt als Paket mit drin.
      - run: pnpm install --frozen-lockfile

      - name: Build inspector
        run: pnpm build

      - name: Build site
        run: pnpm --filter liveaudit-site build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
