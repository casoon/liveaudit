name: Release

# Tag `vX.Y.Z` → verify, then publish `@casoon/liveaudit` to npm with Trusted
# Publishing (provenance, no stored token) after approval in the `npm`
# environment. The tag must match `npm/package.json`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./npm/package.json').version")"

      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Update npm (Trusted Publishing needs >= 11.5)
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # `prepublishOnly` builds the bundle and copies it into npm/.
      - name: Publish
        working-directory: npm
        run: npm publish --access public
