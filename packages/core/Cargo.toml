[package]
name = "liveaudit-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WASM boundary and arena adapter for LiveAudit. Contains no rules of its own."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Aktuelle rustc-Versionen emittieren bulk-memory-Befehle; wasm-opt muss sie
# ausdrücklich zugelassen bekommen, sonst schlägt die Validierung fehl.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[dependencies]
a11y-dom.workspace = true
a11y-report.workspace = true
a11y-rules.workspace = true
accname.workspace = true
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
